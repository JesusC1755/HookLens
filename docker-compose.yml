services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hooklens
      POSTGRES_PASSWORD: hooklens
      POSTGRES_DB: hooklens
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hooklens -d hooklens']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
